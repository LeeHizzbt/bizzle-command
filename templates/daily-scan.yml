# TEMPLATE: copy this file to .github/workflows/daily-scan.yml in your repo (see DAILY_SCAN.md).
# Bizzle Command v4.20: free daily trend scan. Runs once a day (and on demand),
# writes feed/trends.json, and commits it. The app imports it in Trend Radar > Daily feed.
name: Daily trend scan
on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC = 7:17 AM New York (EDT)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan
        run: node scripts/daily-scan.mjs
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/trends.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Daily trend scan $(date -u +%F)"
          git push
